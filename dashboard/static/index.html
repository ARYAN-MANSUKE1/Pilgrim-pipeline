<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pilgrim Pipeline</title>
<style>
  :root { --orange:#FB8B24; --maroon:#9a041e; --bg:#faf7f3; --line:#e7e0d8; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui,"Segoe UI",sans-serif; background:var(--bg); color:#222; }
  header { background:var(--orange); color:#fff; padding:14px 22px; display:flex; align-items:center; gap:12px; }
  header h1 { font-size:18px; margin:0; font-weight:700; }
  header .sub { opacity:.9; font-size:13px; }
  .wrap { padding:18px 22px 120px; }
  .toolbar { display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .toolbar input[type=search] { padding:9px 12px; border:1px solid var(--line); border-radius:8px; min-width:240px; }
  .btn { padding:9px 14px; border:none; border-radius:8px; background:var(--maroon); color:#fff; cursor:pointer; font-size:14px; }
  .btn.ghost { background:#fff; color:var(--maroon); border:1px solid var(--line); }
  .count { margin-left:auto; color:#666; font-size:13px; }
  table { width:100%; border-collapse:collapse; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 1px 4px #0001; }
  th,td { padding:9px 12px; text-align:left; border-bottom:1px solid var(--line); font-size:14px; }
  th { background:#fff6ec; color:#7a3b00; font-weight:600; }
  td.temple a { color:var(--maroon); text-decoration:none; font-weight:600; }
  .langs { display:flex; gap:6px; }
  .chip { display:inline-flex; flex-direction:column; align-items:center; gap:2px; width:36px; padding:3px 0; border-radius:7px;
          font-size:11px; border:1px solid var(--line); background:#fafafa; color:#999; }
  .chip .code { font-weight:700; text-transform:uppercase; }
  .chip.filled { background:#e9f8ec; border-color:#bfe6c7; color:#1c7a34; }
  .chip.src { outline:2px solid var(--orange); }
  .chip .a.on { color:var(--orange); }
  .pager { display:flex; gap:8px; align-items:center; justify-content:center; margin:16px 0; }
  .pager button { padding:7px 12px; border:1px solid var(--line); background:#fff; border-radius:8px; cursor:pointer; }
  .pager button:disabled { opacity:.4; cursor:default; }
  .muted { color:#999; font-size:12px; }
  .loading { padding:40px; text-align:center; color:#888; }

  /* action bar */
  #actionbar { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:2px solid var(--orange);
    box-shadow:0 -3px 14px #0002; padding:10px 22px; display:none; align-items:center; gap:14px; flex-wrap:wrap; z-index:50; }
  #actionbar.show { display:flex; }
  #actionbar .sel { font-weight:700; color:var(--maroon); }
  #actionbar select { padding:7px 9px; border:1px solid var(--line); border-radius:7px; }
  .langpick { display:flex; gap:8px; align-items:center; }
  .langpick label { font-size:13px; display:flex; align-items:center; gap:3px; }

  /* jobs */
  #jobs { margin-top:26px; }
  #jobs h2 { font-size:15px; color:#7a3b00; margin:0 0 8px; display:flex; align-items:center; gap:10px; }
  .status { padding:2px 8px; border-radius:20px; font-size:12px; font-weight:600; }
  .status.queued { background:#eee; color:#666; }
  .status.running { background:#fff0d6; color:#b56b00; }
  .status.done { background:#e9f8ec; color:#1c7a34; }
  .status.failed { background:#fde8e8; color:#c0392b; }
  .logbox { background:#1e1e1e; color:#d6d6d6; font-family:ui-monospace,monospace; font-size:12px; padding:10px 12px;
    border-radius:8px; max-height:220px; overflow:auto; white-space:pre-wrap; margin-top:8px; }
</style>
</head>
<body>
  <header>
    <h1>🛕 Pilgrim Pipeline</h1>
    <span class="sub">translation + audio control panel</span>
  </header>

  <div class="wrap">
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search temples…" onkeydown="if(event.key==='Enter')load(1)">
      <button class="btn" onclick="load(1)">Search</button>
      <span class="count" id="count"></span>
    </div>

    <div id="tablebox"><div class="loading">Loading temples from WordPress…</div></div>

    <div class="pager">
      <button id="prev" onclick="load(state.page-1)">← Prev</button>
      <span id="pageinfo" class="muted"></span>
      <button id="next" onclick="load(state.page+1)">Next →</button>
    </div>

    <div id="jobs">
      <h2>Jobs <span class="muted" id="qdepth"></span> <button class="btn ghost" style="margin-left:auto;padding:4px 10px" onclick="clearJobs()">Clear finished</button></h2>
      <div id="jobsbox"><div class="muted">No jobs yet — select temples below and run.</div></div>
      <div id="logview"></div>
    </div>
  </div>

  <!-- floating action bar -->
  <div id="actionbar">
    <span class="sel"><span id="selcount">0</span> selected</span>
    <label>Operation
      <select id="op">
        <option value="full">Translate + Audio</option>
        <option value="translate">Translate only</option>
        <option value="audio">Audio only</option>
      </select>
    </label>
    <label>Source
      <select id="src">
        <option value="">Auto-detect</option>
        <option value="mr">Marathi</option><option value="en">English</option><option value="hi">Hindi</option>
      </select>
    </label>
    <span class="langpick" id="langpick"></span>
    <button class="btn" onclick="runSelected()">▶ Run</button>
    <button class="btn ghost" onclick="clearSel()">Clear</button>
  </div>

<script>
const LANGS = ["mr","en","hi","gj","ta","te","ml","kn"];
const state = { page:1, pages:1, rows:[], selected:new Set() };

// build language checkboxes (all checked = act on all)
document.getElementById('langpick').innerHTML = 'Languages ' + LANGS.map(l =>
  `<label><input type="checkbox" class="lang" value="${l}" checked>${l}</label>`).join('');

async function load(page) {
  if (page < 1 || page > (state.pages||1) && state.pages) return;
  state.page = page;
  document.getElementById('tablebox').innerHTML = '<div class="loading">Loading…</div>';
  const q = encodeURIComponent(document.getElementById('search').value || '');
  const data = await (await fetch(`/api/temples?page=${page}&per_page=20&search=${q}`)).json();
  state.rows = data.temples; state.pages = data.pages;
  document.getElementById('count').textContent = `${data.total} temples`;
  document.getElementById('pageinfo').textContent = `Page ${data.page} of ${data.pages}`;
  document.getElementById('prev').disabled = data.page<=1;
  document.getElementById('next').disabled = data.page>=data.pages;
  renderTable(data);
}

function chip(code, chars, min, audioOn, isSrc) {
  const filled = chars >= min;
  return `<div class="chip ${filled?'filled':''} ${isSrc?'src':''}" title="${code}: ${chars} chars">
    <span class="code">${code}</span><span>${filled?'✓':'–'}</span>
    <span class="a ${audioOn?'on':''}">${audioOn?'♪':'·'}</span></div>`;
}

function renderTable(data) {
  if (!data.temples.length) { document.getElementById('tablebox').innerHTML='<div class="loading">No temples found.</div>'; return; }
  const rows = data.temples.map(t => {
    const langs = LANGS.map(l => chip(l, t.content[l]??0, data.min_chars, !!t.audio[l], t.source===l)).join('');
    const checked = state.selected.has(t.id) ? 'checked' : '';
    return `<tr>
      <td><input type="checkbox" class="rowchk" data-id="${t.id}" ${checked} onchange="toggleRow(${t.id}, this.checked)"></td>
      <td>${t.id}</td>
      <td class="temple"><a href="${t.link}" target="_blank">${t.title}</a>
          <div class="muted">source: <b>${t.source??'—'}</b></div></td>
      <td><div class="langs">${langs}</div></td>
    </tr>`;
  }).join('');
  document.getElementById('tablebox').innerHTML = `<table><thead><tr>
      <th style="width:34px"><input type="checkbox" onchange="toggleAll(this.checked)"></th>
      <th style="width:64px">ID</th><th>Temple</th><th>Languages (✓ text · ♪ audio)</th>
    </tr></thead><tbody>${rows}</tbody></table>`;
}

function toggleRow(id, on) { on ? state.selected.add(id) : state.selected.delete(id); refreshSel(); }
function toggleAll(on) { state.rows.forEach(t => on ? state.selected.add(t.id) : state.selected.delete(t.id));
  document.querySelectorAll('.rowchk').forEach(c => c.checked = on); refreshSel(); }
function clearSel() { state.selected.clear(); document.querySelectorAll('.rowchk').forEach(c=>c.checked=false); refreshSel(); }
function refreshSel() {
  document.getElementById('selcount').textContent = state.selected.size;
  document.getElementById('actionbar').classList.toggle('show', state.selected.size>0);
}

async function runSelected() {
  const langs = [...document.querySelectorAll('.lang:checked')].map(c=>c.value);
  const body = {
    temples: state.rows.filter(t=>state.selected.has(t.id)).map(t=>({id:t.id,title:t.title})),
    operation: document.getElementById('op').value,
    languages: langs.length===LANGS.length ? null : langs,
    source: document.getElementById('src').value || null,
  };
  // include selected temples not on the current page (by id, title unknown)
  state.selected.forEach(id => { if(!body.temples.find(x=>x.id===id)) body.temples.push({id, title:'Temple '+id}); });
  const res = await (await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json();
  clearSel();
  pollJobs();
  alert(`Queued ${res.queued} temple(s).`);
}

async function pollJobs() {
  const data = await (await fetch('/api/jobs')).json();
  document.getElementById('qdepth').textContent = data.queue_depth ? `(${data.queue_depth} in queue)` : '';
  if (!data.jobs.length) { document.getElementById('jobsbox').innerHTML='<div class="muted">No jobs yet.</div>'; return; }
  const rows = data.jobs.map(j => `<tr onclick="viewLog(${j.id})" style="cursor:pointer">
      <td>#${j.id}</td><td>${j.temple_title}</td><td>${j.operation}</td>
      <td><span class="status ${j.status}">${j.status}</span></td>
      <td class="muted" style="font-size:12px">${j.last||''}</td></tr>`).join('');
  document.getElementById('jobsbox').innerHTML = `<table><thead><tr>
      <th style="width:50px">Job</th><th>Temple</th><th>Op</th><th>Status</th><th>Latest</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
}
async function viewLog(id) {
  const j = await (await fetch('/api/jobs/'+id)).json();
  document.getElementById('logview').innerHTML =
    `<div class="logbox">#${id} ${j.temple_title}\n${(j.logs||[]).join('\n')}${j.error?('\nERROR: '+j.error):''}</div>`;
}
async function clearJobs(){ await fetch('/api/jobs/clear',{method:'POST'}); pollJobs(); document.getElementById('logview').innerHTML=''; }

load(1);
setInterval(pollJobs, 2000);
pollJobs();
</script>
</body>
</html>
